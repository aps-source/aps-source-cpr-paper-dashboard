<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPR Signal History</title>
<style>
  :root { color-scheme: light; --page:#eceff8; --surface:#fff; --text:#0e1320; --muted:#76829c; --grid:#e2e7f1; --good:#12a150; --bad:#dc3545; --warn:#c77d00; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page:#090c14; --surface:#131a29; --text:#eef1f9; --muted:#7f8aa3; --grid:#253048; --good:#2bc85a; --bad:#f0645f; --warn:#f2b636; --accent:#9b8cf3; } }
  body { margin:0; background:var(--page); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:1rem 16px 2rem; }
  h1 { font-size:1.3rem; margin:0.4rem 0 0.2rem; } p { color:var(--muted); margin:0 0 0.8rem; font-size:0.9rem; }
  a { color:var(--accent); }
  .card { background:var(--surface); border-radius:1rem; padding:0.9rem 1rem; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:0.86rem; }
  td,th { padding:0.35rem 0.45rem; text-align:left; border-bottom:1px solid var(--grid); }
  th { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
  .ENTRY { color:var(--good); font-weight:700; } .EXIT { color:var(--accent); font-weight:700; } .MISSED { color:var(--warn); font-weight:700; } .ERROR { color:var(--bad); font-weight:700; }
</style>
</head>
<body>
<!--main-dashboard-link--><div id="main-dashboard-link" data-mode="bar" style="box-sizing:border-box;width:100%;padding:7px 14px;background:#0f172a;font:600 12px/1.3 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:left"><a href="https://aps-source.github.io/" style="color:#e2e8f0;text-decoration:none">&#9666; Main dashboard</a></div><!--/main-dashboard-link-->

<div class="wrap">
  <a href="index.html">&#9666; CPR dashboard</a> &middot; <a href="https://aps-source.github.io/">Main dashboard</a>
  <h1>Strategy signal history</h1>
  <p>Every engine event, latest first (last 300). MISSED = the signal's bar closed while the engine was not running, so no paper fill was taken.</p>
  <div class="card"><table id="t"><tr><td>Loading&hellip;</td></tr></table></div>
</div>
<script>
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  const s = (d.signals||[]).slice().reverse();
  document.getElementById('t').innerHTML = '<tr><th>Time (IST)</th><th>Strategy</th><th>Event</th><th>Detail</th></tr>' +
    (s.length ? s.map(x=>`<tr><td>${x.time}</td><td>${x.strategy}</td><td class="${x.event}">${x.event}</td><td>${x.detail}</td></tr>`).join('')
              : '<tr><td colspan="4">No signals yet.</td></tr>');
});
</script>
</body>
</html>
